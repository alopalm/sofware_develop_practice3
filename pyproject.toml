[project]
name = "iris-project"
version = "0.1.0"
description = "Iris flower classification project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
    "joblib>=1.4,<2",
]

[dependency-groups]
dev = [
    "pdoc>=14.6,<15",
    "jupyter>=1.0,<2",
]